<title>Ring Pick Collect</title>
<style>
/* Layout: one full-bleed stage. Two stacked frames; the incoming scene is revealed by an expanding circle that starts where the last touch happened. */
:root {
  --ground: #ebebeb;
  --ring: rgba(95, 95, 95, 0.42);
  --btn-ink: #5f5f5f;
  --btn-bg: rgba(255, 255, 255, 0.72);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141414;
    --ring: rgba(200, 200, 200, 0.38);
    --btn-ink: #a0a0a0;
    --btn-bg: rgba(20, 20, 20, 0.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141414;
  --ring: rgba(200, 200, 200, 0.38);
    --btn-ink: #a0a0a0;
    --btn-bg: rgba(20, 20, 20, 0.72);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ground); overflow: hidden; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: var(--ground);
}
#a { z-index: 1; }
#b { z-index: 0; visibility: hidden; }
.ring {
  position: absolute; z-index: 3; border-radius: 50%;
  border: 2px solid var(--ring);
  pointer-events: none; opacity: 0;
}
.replay {
  position: absolute; z-index: 4;
  top: 12px; left: max(12px, env(safe-area-inset-left, 0px));
  width: 40px; height: 40px; padding: 0;
  display: grid; place-items: center;
  border: 1.5px solid var(--btn-ink); border-radius: 50%;
  background: var(--btn-bg); color: var(--btn-ink);
  cursor: pointer; opacity: 0.5;
  transition: opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.replay:hover, .replay:focus-visible { opacity: 1; }
.replay:focus-visible { outline: 2px solid var(--btn-ink); outline-offset: 3px; }
.replay svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<div id="stage">
  <iframe id="a" title="Scene"></iframe>
  <iframe id="b" title="Scene"></iframe>
  <button id="replay" class="replay" type="button" aria-label="Replay from the start" title="Replay">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
  </button>
</div>
