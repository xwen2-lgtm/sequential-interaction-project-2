<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ring The Bell</title>
<style>
  /* Layout: a single service bell centered on an empty field; one small reset control in the lower corner. */
  :root {
    --bg: #ebebeb;
    --base: #3c3c3c;
    --dome: #6e6e6e;
    --hi: #c8c8c8;
    --plunger: #2b2b2b;
    --ui: #5f5f5f;
    --hover: #dedede;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414;
      --base: #8a8a8a;
      --dome: #bdbdbd;
      --hi: #f4f4f4;
      --plunger: #e4e4e4;
      --ui: #a0a0a0;
      --hover: #242424;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414;
    --base: #8a8a8a;
    --dome: #bdbdbd;
    --hi: #f4f4f4;
    --plunger: #e4e4e4;
    --ui: #a0a0a0;
    --hover: #242424;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ui);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: relative;
    height: 100%;
    display: grid;
    place-items: center;
    padding-inline: 16px;
  }

  .bell-btn {
    width: min(100%, 60vh, 520px);
    aspect-ratio: 3 / 2;
    padding: 0;
    border: 0;
    background: none;
    pointer-events: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .bell-btn:focus-visible { outline: 2px solid var(--ui); outline-offset: 6px; }
  .bell-btn svg { display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .bell-btn .hit { pointer-events: visiblePainted; cursor: pointer; }

  .b-base { fill: var(--base); }
  .b-dome { fill: var(--dome); }
  .b-hi { fill: none; stroke: var(--hi); stroke-width: 8; stroke-linecap: round; }
  .b-plunger { fill: var(--plunger); }

  .reset {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1.5px solid var(--ui);
    border-radius: 50%;
    background: transparent;
    color: var(--ui);
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s, background-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .reset[data-live="1"] { opacity: 1; }
  .reset:hover { opacity: 1; background: var(--hover); }
  .reset:focus-visible { outline: 2px solid var(--ui); outline-offset: 3px; opacity: 1; }
  .reset svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<main class="stage">
  <button id="ring" class="bell-btn" type="button" aria-label="Ring the bell">
    <svg id="bell" viewBox="30 30 240 160" aria-hidden="true" focusable="false">
      <rect class="hit" x="36" y="40" width="228" height="140" fill="transparent"/>
      <rect class="b-base" x="50" y="150" width="200" height="22" rx="11"/>
      <g transform="translate(0 -12)">
        <g id="swing">
          <path class="b-dome" d="M70 150 A80 70 0 0 1 230 150 Z"/>
          <path class="b-hi" d="M92 138 A58 52 0 0 1 126 98"/>
          <g id="btn">
            <rect class="b-plunger" x="144" y="66" width="12" height="16"/>
            <rect class="b-plunger" x="128" y="54" width="44" height="14" rx="7"/>
          </g>
        </g>
      </g>
    </svg>
  </button>

  <button id="reset" class="reset" type="button" aria-label="Reset" title="Reset" data-live="0">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 12a8 8 0 1 0 2.6-5.9"/>
      <path d="M4 4v5h5"/>
    </svg>
  </button>
</main>

<script>
(function () {
  var ringBtn = document.getElementById('ring');
  var svg = document.getElementById('bell');
  var swing = document.getElementById('swing');
  var btn = document.getElementById('btn');
  var resetBtn = document.getElementById('reset');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DEG = 180 / Math.PI;

  /* ---------- Motion: three damped springs (slide, tilt, button) plus a metallic shiver ---------- */
  var x = 0, vx = 0;      // slide, in SVG units (negative is left)
  var th = 0, w = 0;      // tilt about the base, in radians (negative is counterclockwise)
  var p = 0, vp = 0;      // button press depth, 0..PRESS
  var PRESS = 9;
  var KX = 150, CX = 5.5;
  var KT = 130, CT = 4.6;
  var KP = 420, CP = 16;
  var tr = 9;             // seconds since the strike
  var raf = 0, last = 0;

  function render() {
    var shake = reduce ? 0 : 1.6 * Math.sin(tr * 6.2832 * 38) * Math.exp(-tr * 9);
    swing.setAttribute('transform',
      'translate(' + (x + shake).toFixed(2) + ' 0) rotate(' + (th * DEG).toFixed(2) + ' 150 150)');
    btn.setAttribute('transform', 'translate(0 ' + p.toFixed(2) + ')');
  }

  function setLive(on) { resetBtn.setAttribute('data-live', on ? '1' : '0'); }

  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    var n = 4, h = dt / n;
    for (var i = 0; i < n; i++) {
      vx += (-KX * x - CX * vx) * h;
      x += vx * h;
      w += (-KT * th - CT * w) * h;
      th += w * h;
      vp += (-KP * p - CP * vp) * h;
      p += vp * h;
      if (p < 0) { p = 0; if (vp < 0) vp = -vp * 0.3; }
    }
    tr += dt;
    if (Math.abs(x) < 0.02 && Math.abs(vx) < 0.2 && Math.abs(th) < 0.0008 && Math.abs(w) < 0.01 &&
        Math.abs(p) < 0.02 && Math.abs(vp) < 0.2 && tr > 0.6) {
      x = vx = th = w = p = vp = 0;
      render();
      raf = 0;
      setLive(false);
      return;
    }
    render();
    raf = requestAnimationFrame(frame);
  }

  /* ---------- Sound: hard click, then a bright inharmonic ding, through a compressor ---------- */
  var ctx = null, comp = null, bus = null, noise = null;
  var PARTIALS = [
    [1, 1, 2.2], [2.0, 0.55, 1.2], [2.76, 0.7, 1.4], [4.07, 0.35, 0.8],
    [5.4, 0.45, 0.9], [8.9, 0.22, 0.45], [11.3, 0.14, 0.3]
  ];

  function newBus() {
    bus = ctx.createGain();
    bus.gain.value = 1;
    bus.connect(comp);
  }

  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 6;
      comp.ratio.value = 8;
      comp.attack.value = 0.001;
      comp.release.value = 0.15;
      var master = ctx.createGain();
      master.gain.value = 0.95;
      comp.connect(master);
      master.connect(ctx.destination);
      newBus();
      var len = Math.floor(ctx.sampleRate * 0.035);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function strike(level) {
    var c = audio();
    if (!c) return;
    var now = c.currentTime;
    var f0 = 2350 * (1 + (Math.random() - 0.5) * 0.004);
    var out = c.createGain();
    out.gain.value = level * 0.34;
    out.connect(bus);
    PARTIALS.forEach(function (q) {
      var o = c.createOscillator();
      o.type = 'sine';
      o.frequency.value = f0 * q[0];
      var e = c.createGain();
      e.gain.setValueAtTime(0, now);
      e.gain.linearRampToValueAtTime(q[1], now + 0.001);
      e.gain.exponentialRampToValueAtTime(0.0001, now + q[2]);
      o.connect(e);
      e.connect(out);
      o.start(now);
      o.stop(now + q[2] + 0.05);
    });
    var n = c.createBufferSource();
    n.buffer = noise;
    var hp = c.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3000;
    var ng = c.createGain();
    ng.gain.value = 1.1;
    n.connect(hp);
    hp.connect(ng);
    ng.connect(out);
    n.start(now);
  }

  /* ---------- Interaction ---------- */
  var timer = 0;

  function ring() {
    strike(1);
    clearTimeout(timer);
    timer = setTimeout(function () { strike(0.4); }, 62);   // hammer rebound
    var big = reduce ? 0.25 : 1;
    vx = Math.min(vx, 0) - 95 * big;       // first move is to the left
    w += -1.3 * big;                       // small tilt so the dome never touches the base
    p = PRESS;
    vp = 0;
    tr = 0;
    setLive(true);
    if (!raf) {
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  }

  function reset() {
    clearTimeout(timer);
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    x = vx = th = w = p = vp = 0;
    tr = 9;
    render();
    setLive(false);
    if (ctx) {
      var old = bus;
      old.gain.setTargetAtTime(0, ctx.currentTime, 0.008);
      setTimeout(function () { old.disconnect(); }, 120);
      newBus();
    }
  }

  svg.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button > 0) return;
    ring();
  });
  ringBtn.addEventListener('click', function (e) {
    if (e.detail === 0) ring();   // keyboard activation only; pointer rings on contact
  });
  resetBtn.addEventListener('click', reset);

  render();
})();
</script>

</body></html>
